<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOATlist: who's the greatest?</title>
<meta name="description" content="Pick one. GOATlist runs a quick knockout tournament on your picks and finds your top 10, then shows how it stacks up against everyone else.">
<meta property="og:title" content="GOATlist: who's the greatest?">
<meta property="og:description" content="Tap to pick. Find your top 10 in sports, music, movies and more, and see how it stacks up against everyone.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://goatlists.netlify.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#08080c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c;--panel:#111118;--panel2:#17171f;--line:#24242f;--line2:#33333f;
  --text:#f4f4f7;--muted:#8d8d9c;--dim:#5d5d6b;
  --purple:#6d4aff;--purple2:#8b6dff;--purpleBg:#1c1533;
  --red:#e5484d;--redBg:#2a1215;--gold:#f5c542;--green:#3ecf8e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 70px}
[hidden]{display:none!important}

header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;gap:16px;flex-wrap:wrap}
.logo{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:1px;line-height:1;display:flex;align-items:baseline;cursor:pointer}
.logo b{color:var(--purple2);font-weight:400}
.logo i{font-style:normal;color:var(--red)}
.tagline{font-size:12px;color:var(--muted);margin-left:12px;letter-spacing:.3px;font-family:Inter,sans-serif}
nav.views{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
nav.views button{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);position:relative}
nav.views button.on{background:var(--purple);color:#fff}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;margin-left:6px}

.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;color:var(--muted)}
.cat.on{border-color:var(--purple);color:#fff;background:var(--purpleBg)}
.subs{display:flex;gap:14px 22px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.sgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sgroup .gl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.sub{padding:6px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:500}
.sub.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.banner{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px;display:none}
.banner.show{display:block}
.banner.warn{color:#ffb4b6;border-color:#4a1d20;background:var(--redBg)}

.statrow{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--muted)}
.stat strong{color:var(--text);font-size:15px;margin-right:4px}
.linkbtn{margin-left:auto;font-size:13px;color:var(--purple2);font-weight:600;padding:8px 4px}
.linkbtn:hover{text-decoration:underline}

.prompt{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.5px;text-align:center;margin-bottom:16px}
.prompt span{color:var(--purple2)}
.fo-tag{display:block;font-family:Inter,sans-serif;font-size:12px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.arena{display:grid;grid-template-columns:1fr 64px 1fr;align-items:stretch}
.pick{position:relative;overflow:hidden;background:var(--panel);border:2px solid var(--line);border-radius:18px;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;text-align:center;transition:transform .12s,border-color .15s,background .15s,opacity .2s}
.pick::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--purple))}
.pick::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--c,transparent),transparent 65%);opacity:.13;pointer-events:none}
.pick:hover:not(.locked){border-color:var(--purple);transform:translateY(-2px)}
.pick:active:not(.locked){transform:scale(.98)}
.pick.win{border-color:var(--purple);background:var(--purpleBg)}
.pick.lose{opacity:.5}
.pick.locked{cursor:default}
.mono{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;margin-bottom:16px;background:var(--c,var(--panel2));color:#fff;border:3px solid rgba(255,255,255,.12);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.pname{font-size:clamp(20px,3vw,28px);font-weight:700;line-height:1.15;margin-bottom:8px;position:relative}
.pmeta{font-size:13px;color:var(--muted);position:relative}
.pmeta .chip{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line2);margin-right:6px;font-size:11px;font-weight:600;color:var(--text)}
.pct{font-family:'Bebas Neue',sans-serif;font-size:54px;line-height:1;margin-top:14px;display:none;position:relative}
.pick.win .pct{color:var(--purple2)}
.revealed .pct{display:block}
.key{position:absolute;bottom:12px;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.vs{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--red)}

.result{margin-top:18px;min-height:60px}
.bar{height:10px;border-radius:5px;background:var(--line2);overflow:hidden;display:flex}
.bar .l{background:var(--purple);transition:width .5s}
.bar .r{background:var(--red);transition:width .5s;margin-left:auto}
.split{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:10px}
.verdict{text-align:center;font-size:14px;color:var(--muted);margin-top:12px}
.verdict strong{color:var(--text)}
.actions{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:11px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--panel)}
.btn:hover{border-color:var(--purple)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:var(--purple2)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.ok{border-color:#1d5e43;color:var(--green)}
.btn.no{border-color:#5a2226;color:#ff8a8e}
.timer{height:3px;background:var(--line);border-radius:2px;overflow:hidden;width:180px;margin:12px auto 0}
.timer div{height:100%;background:var(--purple2);width:0}
.timer.run div{width:100%;transition:width 1.6s linear}

.hero{text-align:center;padding:26px 0 30px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(44px,8vw,76px);line-height:.95;letter-spacing:1px}
.hero h1 span{color:var(--purple2)}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--muted);margin:12px auto 20px;max-width:520px;font-size:15px;line-height:1.6}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 14px;gap:10px}
.sectitle h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:30px;letter-spacing:.5px}
.sectitle h2 span{color:var(--gold)}
.sectitle small{color:var(--muted);font-size:13px}
.fogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-bottom:34px}
.fo{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .15s,transform .12s}
.fo:hover{border-color:var(--purple);transform:translateY(-2px)}
.fo .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between}
.fo .mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:12px}
.fo .side{display:flex;align-items:center;gap:8px;min-width:0}
.fo .side.r{flex-direction:row-reverse;text-align:right}
.fo .dot{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c,var(--panel2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fff}
.fo .nm{font-weight:600;font-size:14px;line-height:1.2}
.fo .v{font-family:'Bebas Neue',sans-serif;color:var(--red);font-size:18px}
.fo .split{margin-top:5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;border-top:4px solid var(--c)}
.tile:hover{border-color:var(--purple);border-top-color:var(--c)}
.tile b{display:block;font-size:16px;margin-bottom:4px}
.tile span{font-size:12px;color:var(--muted)}

.rankhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.rankhead h2{font-family:'Bebas Neue',sans-serif;font-size:34px;font-weight:400;letter-spacing:.5px}
.rankhead h2 span{color:var(--purple2)}
.rh-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.toggle button{padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid transparent}
.toggle button.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.list{display:grid;gap:8px}
.top10{margin-bottom:26px}
.row{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 16px;border-left:4px solid var(--c,var(--line))}
.row .rk{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--dim);text-align:center}
.top10 .row:nth-child(1) .rk{color:var(--gold)}
.top10 .row:nth-child(2) .rk,.top10 .row:nth-child(3) .rk{color:var(--purple2)}
.row .nm{font-weight:600;font-size:16px}
.row .sm{font-size:12px;color:var(--muted);margin-top:2px}
.row .wr{text-align:right;font-weight:700;font-size:15px}
.row .wr small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.rest-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:6px 0 10px}
.rest .row{padding:7px 16px;background:transparent}
.rest .row .rk{font-size:22px}
.rest .row .nm{font-size:14px;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:44px 20px;border:1px dashed var(--line2);border-radius:14px;line-height:1.6}
.empty .btn{margin-top:14px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px}
.panel h3{font-size:15px;margin-bottom:12px}
.sharecard{background:linear-gradient(160deg,#17112b,#0b0b10 70%);border:1px solid #2d2350;border-radius:16px;padding:22px;max-width:420px}
.sharecard .sc-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px}
.sharecard .sc-logo b{color:var(--purple2);font-weight:400}.sharecard .sc-logo i{font-style:normal;color:var(--red)}
.sharecard h4{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:28px;margin:6px 0 12px}
.sharecard ol{list-style:none;display:grid;gap:5px}
.sharecard li{display:flex;gap:10px;align-items:center;font-size:14px}
.sharecard li span{font-family:'Bebas Neue',sans-serif;width:22px;color:var(--purple2);font-size:18px}
.sharecard li:first-child span{color:var(--gold)}
.sharecard .sc-foot{font-size:11px;color:var(--muted);margin-top:14px}
.share-actions{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.copied{font-size:13px;color:var(--green)}

.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--purple)}
.ferr{font-size:13px;color:#ff8a8e;min-height:18px}
.fok{font-size:13px;color:var(--green)}

.cmp-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.cmp-top select{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px;min-width:220px}
.match{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.mcard .big{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;color:var(--purple2)}
.mcard .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.twocol h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.twocol .row{grid-template-columns:36px 1fr;padding:8px 12px}
.twocol .row .rk{font-size:22px}
.twocol .row .nm{font-size:14px}
.twocol .row.shared{background:var(--purpleBg);border-color:#3a2d6b}
.dis{display:grid;gap:8px}
.disrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.disrow .who{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.disrow .sub2{grid-column:1/-1;font-size:11px;color:var(--dim)}
.sugg{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sugg .sm{font-size:12px;color:var(--muted);margin-top:2px}

.accs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px;position:relative;max-width:340px}
.acc{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.35);color:var(--gold)}
.acc.hof{background:rgba(139,109,255,.14);border-color:rgba(139,109,255,.45);color:#c3b4ff}
.tape{max-width:420px;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tt-head{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:center;margin-bottom:6px}
.tt-row{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.tt-row span{text-align:center;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tt-row span.lead{color:var(--gold);font-weight:700}
.tt-row em{font-style:normal;text-align:center;font-size:12px;color:var(--text)}
.tt-foot{font-size:10px;color:var(--dim);text-align:center;margin-top:6px}
.row .acl{font-size:11px;color:var(--gold);margin-top:3px;opacity:.9}
@media (max-width:680px){.pick .accs{display:none}}
@media (max-width:680px){
  .arena{grid-template-columns:1fr;gap:10px}
  .vs{font-size:26px;height:24px}
  .pick{min-height:170px;padding:22px 14px}
  .mono{width:60px;height:60px;font-size:26px;margin-bottom:10px}
  .key{display:none}
  .tagline{display:none}
  .twocol{grid-template-columns:1fr}
}
.pmeta .info{color:var(--text);opacity:.85}
.aw{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.35);color:var(--gold);margin-right:4px}
.stat.lvl{display:flex;align-items:center;gap:8px}
.xpbar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2))}
.timer.run div{transition:width .95s linear}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--panel2);border:1px solid #4d3f12;color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;transition:all .25s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast strong{color:var(--gold)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.mestats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:30px}
.bdg{border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;opacity:.45}
.bdg b{display:block;font-size:13px}
.bdg small{font-size:11px;color:var(--muted)}
.bdg.on{opacity:1;border-style:solid;border-color:#4d3f12;background:rgba(245,197,66,.07)}
.bdg.on b{color:var(--gold)}
.megrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mecard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:14px 16px}
.mehead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}
.mehead b{display:block;font-size:15px}
.mehead small{font-size:12px;color:var(--muted)}
.mebtns{display:flex;gap:6px}
.mebtns .btn{padding:5px 9px;font-size:12px}
.mecard ol,.clist{list-style:none;display:grid;gap:4px}
.mecard li,.clist li{display:flex;gap:10px;font-size:14px;align-items:center}
.mecard li span,.clist li span{font-family:'Bebas Neue',sans-serif;width:20px;color:var(--purple2);font-size:17px}
.mecard li:first-child span{color:var(--gold)}
.clist li.hit{color:var(--gold)}
.buildgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.slots{display:grid;gap:6px}
.slot{display:flex;align-items:center;gap:10px;min-height:48px;border:1px dashed var(--line2);border-radius:12px;padding:6px 10px;transition:border-color .12s,background .12s}
.slot.full{border-style:solid;background:var(--panel);border-left:4px solid var(--c);cursor:grab}
.slot.over{border-color:var(--purple);background:var(--purpleBg)}
.slot .sn{font-family:'Bebas Neue',sans-serif;font-size:22px;width:24px;text-align:center;color:var(--dim)}
.slot:nth-child(1) .sn{color:var(--gold)}
.slot .snm{font-weight:600;font-size:14px;flex:1;min-width:0}
.slot .cr{font-size:11px;color:var(--muted);white-space:nowrap}
.slot .ph{font-size:13px;color:var(--dim)}
.sbtns{display:flex;gap:2px}
.sbtns button{width:26px;height:26px;border-radius:7px;color:var(--muted);font-size:14px}
.sbtns button:hover{background:var(--panel2);color:var(--text)}
.dot2{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);display:inline-flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;color:#fff}
.poolwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:12px}
.search{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.search:focus{outline:none;border-color:var(--purple)}
.pool{display:flex;flex-wrap:wrap;gap:6px;max-height:520px;overflow:auto}
.pitem{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-size:13px;font-weight:500;cursor:grab}
.pitem:hover{border-color:var(--purple)}
@media (max-width:680px){
  .arena{grid-template-columns:1fr 26px 1fr!important;gap:0!important}
  .vs{font-size:20px!important;height:auto!important}
  .pick{min-height:200px!important;padding:18px 8px!important;border-radius:14px}
  .mono{width:50px!important;height:50px!important;font-size:22px!important;margin-bottom:10px!important}
  .pname{font-size:16px!important}
  .pmeta{font-size:11px}
  .pct{font-size:36px}
  .tape{font-size:13px}
  .buildgrid{grid-template-columns:1fr}
  .poolwrap{position:static}
  .pool{max-height:260px}
  nav.views button{padding:7px 10px;font-size:13px}
}
.snav{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;width:100%}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{padding:7px 16px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--purple);color:#fff}
.sporttabs{display:flex;gap:6px}
.fsel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fsel label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.fsel select{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--text)}
.fsel select:focus{outline:none;border-color:var(--purple)}
.fsel .linkbtn{margin-left:0;padding:4px}
.fnote{font-size:12px;color:var(--muted)}
.lgchip{background:var(--purpleBg)!important;border-color:#3a2d6b!important;color:#c3b4ff!important}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mx-h{font-weight:700;font-size:13px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mx-h span{font-size:10px;color:var(--muted);font-weight:600;margin-left:4px}
.mx-row{font-size:13px;color:var(--muted);padding:3px 0}
.mx-row b{color:var(--gold);display:inline-block;min-width:26px}
@media (max-width:680px){.snav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.snav>*{flex:none}.fsel{flex-wrap:nowrap}}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips .gl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-right:2px}
.fchip{padding:5px 11px;border-radius:999px;border:1px dashed var(--line2);font-size:12px;color:var(--muted);font-weight:500}
.fchip.on{border-style:solid;border-color:var(--purple);color:#fff;background:var(--purpleBg)}
.mono.ph-on,.dot.ph-on,.dot2.ph-on{background:var(--panel2);overflow:hidden;padding:0}
.mono img,.dot img,.dot2 img,.thumb img,.phbig img{width:100%;height:100%;object-fit:cover;display:block}
.mono.ph-on{width:132px;height:132px;border-radius:22px;border:3px solid var(--c)}
.thumb{display:inline-block;width:26px;height:26px;border-radius:50%;overflow:hidden;vertical-align:-7px;margin-right:8px;border:2px solid var(--c)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.phcell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.phbig{width:72px;height:72px;border-radius:14px;background:var(--c);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;overflow:hidden}
.phbig.ph-on{background:var(--panel2)}
.phn{font-size:12px;font-weight:600;line-height:1.2;min-height:28px}
.phcell .btn{cursor:pointer}
#phSel{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:14px}
@media (max-width:680px){.mono.ph-on{width:80px!important;height:80px!important;border-radius:16px}.chips{flex-wrap:nowrap}}
.friends{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.fr-ok{color:var(--green)}
.fr-no{color:#ff8a8e}
.timer.run div{transition:width .95s linear}

/* v8 declutter */
.prog{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px}
.prog-top,.prog-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog-top b{color:var(--text)}
.prog-top b.ok{color:var(--green)}
.prog-bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden;margin:9px 0 6px}
.prog-bar div{height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));transition:width .4s}
.prog-bot{font-size:12px}
.prog-bot .linkbtn{padding:2px 0}
.reveal{display:flex;flex-direction:column;align-items:center;margin-bottom:24px}
.reveal .sharecard{width:100%;max-width:440px}
.sharecard li em{font-style:normal;font-size:10px;color:var(--red);border:1px solid #5a2226;border-radius:999px;padding:0 6px;margin-left:auto}
.suggest-foot{text-align:center;margin-top:28px}
.suggest-foot .linkbtn{color:var(--dim);font-weight:500;font-size:12px;margin:0}
.tiles.big{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tiles.big .tile{padding:20px 18px;border-top-width:5px}
.tiles.big .tile b{font-size:18px;margin-bottom:6px}
.fogrid.three{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.hero p{max-width:480px}
.meline{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--muted);padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.meline b{color:var(--text)}
.badgeline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:28px}
.bpill{font-size:12px;font-weight:600;color:var(--gold);border:1px solid #4d3f12;background:rgba(245,197,66,.07);border-radius:999px;padding:4px 10px}
.bnone{font-size:12px;color:var(--dim);margin-right:8px}
.cmp-top select{margin-right:6px}
#cmpSub{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px}
.pick .accs{max-width:300px}
/* v9 contenders + gauntlet */
#voteView.picking #arena,#voteView.picking #tape,#voteView.picking #result,#voteView.picking #prompt,#voteView.picking .suggest-foot,#voteView.picking #suggestBox{display:none}
.picker{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.picker h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:32px;letter-spacing:.5px;margin-bottom:6px}
.picker p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.picker p b{color:var(--text)}
.pgrid{display:flex;flex-wrap:wrap;gap:7px;max-height:420px;overflow:auto;padding:2px}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-size:13px;font-weight:500}
.pchip:hover{border-color:var(--purple)}
.pchip.on{background:var(--purpleBg);border-color:var(--purple2);color:#fff}
.pchip.on .dot2{outline:2px solid var(--purple2)}
.pbar{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.pbar span{margin-right:auto}
.pbar b{color:var(--text);font-size:18px}
.btn[disabled]{opacity:.4;cursor:default}
.gline{display:flex;justify-content:center;gap:18px;margin-top:10px;flex-wrap:wrap}
.gline .linkbtn,.rowg{margin:0;font-size:12px;color:var(--muted);font-weight:500}
.gline .linkbtn:hover,.rowg:hover{color:var(--purple2)}
.rowg{display:block;padding:2px 0 0;margin-left:auto}
.prog.gaunt{border-color:#3a2d6b;background:var(--purpleBg)}

.logo b{color:var(--purple2)}
.early{font-size:12px;color:var(--gold);border:1px solid #4d3f12;background:rgba(245,197,66,.07);border-radius:999px;padding:4px 10px}
.acct{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;font-size:14px;color:var(--muted)}
.acct form,.acct>span{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acct b{color:var(--text)}
.acct input{background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:14px;min-width:220px;color:var(--text)}
.acct input:focus{outline:none;border-color:var(--purple)}
.acct .linkbtn{margin:0}
.acct:has(.linkbtn[data-signout]){display:flex;justify-content:space-between;align-items:center}
footer.site{border-top:1px solid var(--line);margin-top:50px;padding:22px 0 10px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
footer.site a{color:var(--muted);text-decoration:none}
footer.site a:hover{color:var(--text)}

// ---- account (Me page)

  else if (d.badd) buildAdd(d.badd);

// ---------- game layer ----------
const dayStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function streak() {
  const set = new Set(S.prog.days || []); const d = new Date();
  if (!set.has(dayStr(d))) d.setDate(d.getDate() - 1);
  let n = 0; while (set.has(dayStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const level = () => Math.floor(S.prog.xp / 250) + 1;
function loadProg(p) {
  if (!p || typeof p !== 'object') return;
  const P = S.prog;
  P.xp = Math.max(P.xp, +p.xp || 0);
  P.days = [...new Set([...(P.days || []), ...(Array.isArray(p.days) ? p.days.filter(x => typeof x === 'string') : [])])].sort().slice(-400);
  P.ht = Math.max(P.ht, +p.ht || 0);
  P.best = Math.max(P.best || 0, +p.best || 0);
  if (p.b && typeof p.b === 'object') for (const k in p.b) if (Array.isArray(p.b[k]) && !P.b[k]) P.b[k] = p.b[k].filter(x => typeof x === 'string').slice(0, 10);
  P.bd = [...new Set([...(P.bd || []), ...(Array.isArray(p.bd) ? p.bd : [])])];
  if (p.cont && typeof p.cont === 'object') { P.cont = P.cont || {}; for (const k in p.cont) if (Array.isArray(p.cont[k]) && !P.cont[k]) P.cont[k] = p.cont[k].filter(x => typeof x === 'string').slice(0, 200); }
}
function completedLists() {
  const seen = {};
  for (const k in S.mine) { const [s2, a, b] = k.split(':'); (seen[s2] ||= new Set()).add(a); seen[s2].add(b); }
  return Object.keys(seen).filter(sid => SUBS[sid] && SUBS[sid].list.every(x => seen[sid].has(x.id)));
}
const BADGES = [
  {id:'v100', name:'Century', desc:'Cast 100 votes', t:() => S.prog.xp >= 1000},
  {id:'v500', name:'Veteran', desc:'Cast 500 votes', t:() => S.prog.xp >= 5000},
  {id:'v1000', name:'Legend', desc:'Cast 1,000 votes', t:() => S.prog.xp >= 10000},
  {id:'v5000', name:'GOAT voter', desc:'Cast 5,000 votes', t:() => S.prog.xp >= 50000},
  {id:'s7', name:'On fire', desc:'7-day streak', t:() => (S.prog.best || 0) >= 7},
  {id:'s30', name:'Locked in', desc:'30-day streak', t:() => (S.prog.best || 0) >= 30},
  {id:'s100', name:'Unstoppable', desc:'100-day streak', t:() => (S.prog.best || 0) >= 100},
  {id:'h10', name:'Contrarian', desc:'10 hot takes (with 20% or less)', t:() => S.prog.ht >= 10},
  {id:'h50', name:'Hot take artist', desc:'50 hot takes', t:() => S.prog.ht >= 50},
  {id:'c1', name:'Completionist', desc:'Vote on every option in a list', t:() => completedLists().length >= 1},
  {id:'c5', name:'Collector', desc:'Complete 5 lists', t:() => completedLists().length >= 5},
  {id:'c15', name:'Encyclopedia', desc:'Complete 15 lists', t:() => completedLists().length >= 15}
];
function checkBadges() {
  const P = S.prog; const had = new Set(P.bd || []);
  const fresh = BADGES.filter(b => !had.has(b.id) && b.t());
  if (!fresh.length) return;
  P.bd = [...had, ...fresh.map(b => b.id)];
  toast(`Badge unlocked: <strong>${esc(fresh[0].name)}</strong> &middot; ${esc(fresh[0].desc)}`);
}
let toastT = null;
function toast(html) {
  const t = $('toast'); t.innerHTML = html; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);

// ---------- Me page ----------
function renderMe() {
  const P = S.prog, earned = new Set(P.bd || []);
  const cards = [];
  CATS.filter(c => !c.hidden).forEach(c => c.subs.forEach(sb => {
    const save = S.sub; S.sub = sb.id; const f = finder(sb.id); S.sub = save;
    const list = f.O.filter(x => f.games[x.id] > 0).slice(0, 10);
    if (list.length < 3) return;
    cards.push(`<div class="mecard" style="--c:${sb.c}">

    <div class="sectitle"><h2>My <span style="color:var(--purple2)">top 10s</span></h2><small>${cards.length} list${cards.length === 1 ? '' : 's'}</small></div>
    ${cards.length ? `<div class="megrid">${cards.join('')}</div>` : `<div class="empty">Start voting and your top 10s show up here.<br><button class="btn primary" data-go="vote">Find your top 10</button></div>`}
`;
}
// ---------- Build mode ----------
const bKey = () => bKey0() + (S.chip[S.sub] ? '#' + S.chip[S.sub] : '');
const bKey0 = () => { const fg = SUBS[S.sub].fg; if (fg) return [S.sub, S.filt[fg].era].filter(Boolean).join('|'); const sp = SUBS[S.sub].ath; if (!sp || sp === 'all') return S.sub; const f = S.filt[sp]; return [S.sub, f.era, f.pos].filter(Boolean).join('|'); };
const myBuild = () => (S.prog.b[bKey()] ||= []).filter(id => SUBS[S.sub].byId[id]);
let buildSaveT = null;
function buildChanged() {
  S.prog.b[bKey()] = myBuild();
  renderBuild();
  clearTimeout(buildSaveT); buildSaveT = setTimeout(persist, 700);
}
function buildAdd(id, at) {
  const b = myBuild().filter(x => x !== id);
  if (b.length >= 10 && at == null) { toast('Your top 10 is full. Remove one first.'); return; }
  if (at == null || at > b.length) b.push(id); else b.splice(at, 0, id);
  S.prog.b[bKey()] = b.slice(0, 10); buildChanged();
}
function buildRemove(i) { const b = myBuild(); b.splice(i, 1); S.prog.b[bKey()] = b; buildChanged(); }
function buildMove(i, j) { const b = myBuild(); if (j < 0 || j >= b.length) return; const [x] = b.splice(i, 1); b.splice(j, 0, x); S.prog.b[bKey()] = b; buildChanged(); }

function renderBuild() {
  const sub = SUBS[S.sub], b = myBuild();
  const crowd = viewOrder(S.sub, 'global'), cRank = Object.fromEntries(crowd.map((x, i) => [x.id, crowd[i].g ? i + 1 : null]));
  const slots = [];
  for (let i = 0; i < 10; i++) {
    const it = b[i] ? sub.byId[b[i]] : null;
    slots.push(it ? `<div class="slot full" draggable="true" data-drag="${it.id}" data-slot="${i}" style="--c:${it.c}">
        <span class="sn">${i + 1}</span>${avatar(it, 'dot2')}<span class="snm">${esc(it.name)}</span>
        <span class="cr">${cRank[it.id] ? 'Crowd #' + cRank[it.id] : 'Unranked'}</span>
        <span class="sbtns"><button data-bmove="${i},-1" aria-label="Move up">&uarr;</button><button data-bmove="${i},1" aria-label="Move down">&darr;</button><button data-brem="${i}" aria-label="Remove">&times;</button></span></div>`
      : `<div class="slot" data-slot="${i}"><span class="sn">${i + 1}</span><span class="ph">Drag or tap an option</span></div>`);
  }
  $('buildView').innerHTML = `
    <div class="rankhead"><h2>Build your <span>top 10</span>: ${esc(filterLabel(S.sub))}</h2>
      <div class="rh-right">${b.length ? '<button class="btn small" data-bclear="1">Clear</button>' : ''}</div></div>
    <div class="buildgrid">
      <div><div class="slots" id="slots">${slots.join('')}</div><div id="buildCrowd"></div></div>
      <div class="poolwrap"><input id="bSearch" class="search" placeholder="Search ${esc(sub.label)}" value="${esc(S.bq)}" autocomplete="off"><div class="pool" id="pool" data-pool="1"></div></div>
    </div>`;
  renderPool(); renderBuildCrowd();
}
function renderPool() {
  const sub = SUBS[S.sub], b = new Set(myBuild()), q = S.bq.trim().toLowerCase();
  const items = sub.list.filter(x => inFilter(S.sub, x) && !b.has(x.id) && (!q || x.name.toLowerCase().includes(q)));
  const el = $('pool'); if (!el) return;
  el.innerHTML = items.length ? items.map(x => `<button class="pitem" draggable="true" data-drag="${x.id}" data-badd="${x.id}" style="--c:${x.c}">${avatar(x, 'dot2')}${esc(x.name)}</button>`).join('')
    : `<div class="ph" style="padding:14px">${q ? 'No matches.' : 'Everything is in your top 10.'}</div>`;
}
function renderBuildCrowd() {
  const el = $('buildCrowd'); if (!el) return;
  const sub = SUBS[S.sub], b = myBuild();
  const crowd = viewOrder(S.sub, 'global').filter(x => x.g > 0).slice(0, 10);
  if (!b.length) { el.innerHTML = ''; return; }
  const cset = new Set(crowd.map(x => x.id)), overlap = b.filter(id => cset.has(id)).length;
  el.innerHTML = `<div class="panel" style="margin-top:16px">
    <h3>You vs the crowd</h3>
    ${crowd.length ? `<div class="match" style="margin-bottom:12px"><div class="mcard"><div class="big">${overlap}/${Math.min(10, b.length)}</div><div class="lbl">of your picks are in the crowd's top 10</div></div></div>
      <div class="rest-title">Crowd's top 10</div><ol class="clist">${crowd.map((x, i) => `<li class="${b.includes(x.id) ? 'hit' : ''}"><span>${i + 1}</span>${esc(x.name)}</li>`).join('')}</ol>`
      : `<div style="color:var(--muted);font-size:14px">No crowd votes in ${esc(sub.label)} yet.</div>`}
  </div>`;
}
let dragId = null;
document.addEventListener('dragstart', e => { const t = e.target.closest('[data-drag]'); if (!t) return; dragId = t.dataset.drag; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} });
document.addEventListener('dragover', e => { if (dragId && e.target.closest('[data-slot],[data-pool]')) { e.preventDefault(); const s2 = e.target.closest('[data-slot]'); document.querySelectorAll('.slot.over').forEach(x => x.classList.remove('over')); if (s2) s2.classList.add('over'); } });
document.addEventListener('drop', e => {
  const s2 = e.target.closest('[data-slot]'), pool = e.target.closest('[data-pool]');
  if (!dragId || (!s2 && !pool)) return; e.preventDefault();
  const id = dragId; dragId = null;
  if (pool) { const i = myBuild().indexOf(id); if (i >= 0) buildRemove(i); return; }
  const at = +s2.dataset.slot, b = myBuild(), from = b.indexOf(id);
  if (from >= 0) buildMove(from, Math.min(at, b.length - 1)); else buildAdd(id, Math.min(at, b.length));
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.slot.over').forEach(x => x.classList.remove('over')); });

function shareImage(title, names) {
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, W, H); grd.addColorStop(0, '#1c1533'); grd.addColorStop(0.7, '#0b0b10'); g.fillStyle = grd; g.fillRect(0, 0, W, H);
  g.fillStyle = '#f4f4f7'; g.font = '700 64px "Bebas Neue", Inter, sans-serif'; g.fillText('GOAT', 80, 130); const w = g.measureText('GOAT').width; g.fillStyle = '#8b6dff'; g.fillText('list', 80 + w, 130);
  g.fillStyle = '#f4f4f7'; g.font = '700 58px Inter, sans-serif';
  const words = title.split(' '); let line = '', y = 240; words.forEach(wd => { const t = line ? line + ' ' + wd : wd; if (g.measureText(t).width > W - 160) { g.fillText(line, 80, y); y += 70; line = wd; } else line = t; }); g.fillText(line, 80, y);
  y += 80;
  names.slice(0, 10).forEach((n, i) => { g.fillStyle = i === 0 ? '#f5c542' : '#8b6dff'; g.font = '700 54px "Bebas Neue", Inter, sans-serif'; g.fillText(String(i + 1), 80, y + i * 88);
    g.fillStyle = '#f4f4f7'; g.font = '600 46px Inter, sans-serif'; let nm = n; while (g.measureText(nm).width > W - 260 && nm.length > 4) nm = nm.slice(0, -2); g.fillText(nm === n ? n : nm + '…', 170, y + i * 88); });
  g.fillStyle = '#8d8d9c'; g.font = '500 34px Inter, sans-serif'; g.fillText('Make yours at ' + location.host, 80, H - 80);
  c.toBlob(async blob => {
    const file = new File([blob], 'my-goatlist.png', {type: 'image/png'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { try { await navigator.share({files: [file], title: 'My GOATlist'}); return; } catch (e) {} }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'my-goatlist.png'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }, 'image/png');
}
